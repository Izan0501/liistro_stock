# ============================================================
# Liistro Stock ERP — Docker Compose
# For LOCAL DEVELOPMENT ONLY.
# Production should use managed Supabase PostgreSQL, not this DB container.
# ============================================================

services:
  # ── Local PostgreSQL (dev only) ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: liistro
      POSTGRES_PASSWORD: liistro_dev_password
      POSTGRES_DB: liistro_stock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liistro -d liistro_stock"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Application ─────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source for hot-reload in development (remove in prod image)
      - .:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --loop uvloop
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
